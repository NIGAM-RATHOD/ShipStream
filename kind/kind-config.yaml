# kind cluster for ShipStream: 1 control-plane + 2 workers.
# Create with:  kind create cluster --config kind/kind-config.yaml
# (scripts/local-up.sh does this plus the registry and ingress wiring.)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shipstream

# Let containerd look up per-registry config in /etc/containerd/certs.d.
# local-up.sh drops a hosts.toml there that maps localhost:5001 -> kind-registry:5000.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

nodes:
  - role: control-plane
    # ingress-nginx's kind manifest schedules the controller only on nodes
    # labelled ingress-ready=true, and binds hostPorts 80/443 there.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
